# Minimal static deployment for GitHub Pages (project sites under /<repo>/).
#
# Node 22 is the version this template is developed and verified against.
# Pages runs `npm ci` + `npm run build` from the repository root and publishes
# the `dist/` artifact. BASE_PATH is derived from the repository name so the
# same source also works on Cloudflare Pages without editing any file.
#
# For a user/organisation site (https://<owner>.github.io) set the
# `DEPLOY_BASE` repository variable to "/" in the repository settings.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A repo named "physics2" is served from /physics2/, so every asset
      # and link Astro emits has to carry that prefix. Declared once at job
      # level so the link check validates the same output the build produced
      # (it previously ran without BASE_PATH and flagged every correct link
      # as broken). SITE_URL stays the bare origin: absoluteUrl() appends
      # BASE_PATH itself, so including the repo name here would emit
      # /physics2/physics2/ canonical URLs.
      BASE_PATH: ${{ vars.DEPLOY_BASE || format('/{0}', github.event.repository.name) }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Validate built output
        run: node scripts/validate-content.mjs --links

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0